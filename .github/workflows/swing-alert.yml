name: Gold Silver Swing Alert

on:
  schedule:
    # 5 minutes past every hour, so a fresh 1h candle has closed before we check it.
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      send_test_message:
        description: 'Send a test Telegram message instead of running the real analysis'
        type: boolean
        default: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python test_telegram.py
        if: ${{ inputs.send_test_message }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - run: python main.py
        if: ${{ !inputs.send_test_message }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
