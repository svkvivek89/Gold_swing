name: Gold Silver Swing Alert

on:
  schedule:
    # 5 minutes past every hour, so a fresh 1h candle has closed before we check it.
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options:
          - run
          - test_message
          - backtest
          - strategy_backtest
          - strategy_search
        default: run

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python test_telegram.py
        if: ${{ inputs.mode == 'test_message' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - run: python backtest.py
        if: ${{ inputs.mode == 'backtest' }}

      - run: python strategy_backtest.py
        if: ${{ inputs.mode == 'strategy_backtest' }}

      - run: python strategy_search.py
        if: ${{ inputs.mode == 'strategy_search' }}

      - run: python main.py
        if: ${{ inputs.mode == 'run' || inputs.mode == '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
